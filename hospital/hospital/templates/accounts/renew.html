{% extends "base.html" %}
{% block title %}Renew Certificate{% endblock %}
{% block content %}
<div class="container mt-5">
  <div class="card shadow">
    <div class="card-header">
      <h4>Certificate Renewal Required</h4>
    </div>
    <div class="card-body">
      <p>Your medical certificate has expired or will expire soon. You must renew it to continue using the system.</p>
      <button id="renew-btn" class="btn btn-primary">Renew Certificate</button>
    </div>
  </div>
</div>

<script>
document.addEventListener("DOMContentLoaded", function() {
  const renewalToken = "{{ renewal_token }}";  // injected from view

  document.getElementById("renew-btn").addEventListener("click", async () => {
  const username = "{{ user.username }}";

  try {
    const res = await loggedFetch("{% url 'webauth:renew_certificate' %}", {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "X-CSRFToken": "{{ csrf_token }}"
      },
      body: JSON.stringify({ token: renewalToken })
    }, {
      logger: securityLogger,
      action: "renewCertificate",
      username: username,
      logOnSuccess: true,
      logOnError: true
    });

    if (!res.ok) {
      const data = await res.json().catch(() => ({}));
      alert("Renewal failed: " + (data.error || "Unknown error"));
      return;
    }

    const data = await res.json();

    // Download certificate
    const base64 = data.certificate.replace(/-/g, '+').replace(/_/g, '/');
    const bytes = Uint8Array.from(atob(base64), c => c.charCodeAt(0));
    const blob = new Blob([bytes], { type: "application/x-pkcs12" });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = "doctor_certificate.p12";
    a.click();
    URL.revokeObjectURL(a.href);

    // Show password modal
    showCertificateModal(data.password);
  } catch (err) {
    alert("Renewal failed: " + err.message);
  }
  });
});

function showCertificateModal(password) {
  const modalHTML = `
    <div id="cert-modal" style="
      position: fixed;
      top:0; left:0;
      width:100%; height:100%;
      background: rgba(0,0,0,0.5);
      display:flex;
      justify-content:center;
      align-items:center;
      z-index:9999;
    ">
      <div style="background:white; padding:2rem; border-radius:8px; max-width:400px; width:90%;">
        <h3>Certificate Renewed</h3>
        <p><strong>Save this password - it will only be shown once:</strong></p>
        <input type="text" id="cert-password-display" value="${password}" readonly
               style="width:100%; padding:0.5rem; font-family: monospace; margin-bottom:0.5rem;">
        <button onclick="copyCertPassword()" style="width:100%; padding:0.5rem; margin-bottom:0.5rem;">Copy Password</button>
        <button onclick="closeModalAndRedirect()" style="width:100%; padding:0.75rem;">Continue to Login</button>
      </div>
    </div>
  `;
  document.body.insertAdjacentHTML('beforeend', modalHTML);
}

function copyCertPassword() {
    const passwordInput = document.getElementById('cert-password-display');
    passwordInput.select();
    document.execCommand('copy');
    
    // Show feedback
    const btn = event.target;
    const originalText = btn.textContent;
    btn.textContent = '✓ Copied!';
    btn.style.background = '#28a745';
    
    setTimeout(() => {
        btn.textContent = originalText;
        btn.style.background = '#4A90E2';
    }, 2000);
}

function closeModalAndRedirect() {
  document.getElementById('cert-modal').remove();
  window.location.href = "{% url 'login' %}";
}
</script>
{% endblock %}
