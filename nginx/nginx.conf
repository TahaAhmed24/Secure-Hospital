worker_processes 1;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    keepalive_timeout 65;

    # HTTPS server for hospital
    server {
        listen 443 ssl;
        http2 on;
        server_name localhost;

        # SSL Configuration
        ssl_certificate /etc/nginx/ssl/fullchain_with_root.pem;
        ssl_certificate_key /etc/nginx/ssl/server/server.key;

        # SSL Settings
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers on;
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
        ssl_session_timeout 1d;
        ssl_session_cache shared:SSL:50m;

        # Client certificate verification (optional mutual TLS)
        ssl_client_certificate /etc/nginx/ssl/chain.pem;
        ssl_verify_client optional;
        ssl_verify_depth 2;

        # Security Headers
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;

        location / {
            proxy_pass http://hospital:8000;
            proxy_set_header X-SSL-CLIENT-CERT $ssl_client_cert;
            proxy_set_header X-SSL-USER-DN $ssl_client_s_dn;
            proxy_set_header X-SSL-VERIFIED $ssl_client_verify;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $server_name;
            proxy_set_header X-Forwarded-Port $server_port;

            # Timeouts
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }

        location /static/ {
            alias /app/static/;
            expires 30d;
            add_header Cache-Control "public, immutable";
        }

        location /media/ {
            alias /app/media/;
            expires 7d;
            add_header Cache-Control "public";
        }

        # Add this location block
        location /shared_keys/ {
            alias /shared_keys/;
            add_header Content-Type text/plain;
            add_header Access-Control-Allow-Origin *;
        }
    }

    # HTTP server for securityLogger (port 9000)
    server {
        listen 9000;
        server_name localhost;
        
        location /securityLogger/ {

            rewrite ^/securityLogger/(.*) /$1 break;
            proxy_pass http://securitylogger:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Timeouts
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }
        
        # Handle requests without trailing slash
        location = /securityLogger {
            return 301 /securityLogger/;
        }
    }

    # HTTP to HTTPS redirect (for main hospital app only)
    server {
        listen 80;
        server_name localhost;
        return 301 https://$server_name$request_uri;
    }
}